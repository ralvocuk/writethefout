# writetheFout. sürüm yayını: "v*" etiketi gönderilince Windows kurulumunu derler, imzalar ve
# GitHub Releases'a koyar. latest.json, uygulamanın otomatik güncellemesi buradan okur.
# YAYINLA.bat bu dosyayı .github/workflows/release.yml olarak kopyalar.
name: Sürüm yayınla

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm test

      - name: Güncelleme ayarları (bu depo için)
        shell: pwsh
        run: |
          $cfg = @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{ endpoints = @("https://github.com/${{ github.repository }}/releases/latest/download/latest.json") } }
          }
          $cfg | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 src-tauri/tauri.release.conf.json
          Get-Content src-tauri/tauri.release.conf.json

      - name: Sürüm notları
        id: notes
        shell: pwsh
        run: |
          $body = if (Test-Path SURUM-NOTLARI.md) { Get-Content SURUM-NOTLARI.md -Raw } else { "writetheFout. ${{ github.ref_name }}" }
          $d = "NOTES_$(Get-Random)"
          "body<<$d" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body.Trim() | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $d | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'writetheFout. ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
